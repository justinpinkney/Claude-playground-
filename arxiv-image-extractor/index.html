<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Image Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: white;
            padding: 20px;
            color: black;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            border: 2px solid black;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 0;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid black;
            font-size: 14px;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: 2px solid black;
            font-size: 14px;
            font-family: monospace;
            cursor: pointer;
        }

        button:hover {
            background: white;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info {
            font-size: 12px;
        }

        .status {
            border: 2px solid black;
            padding: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .image-card {
            border: 2px solid black;
        }

        .image-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-info {
            padding: 10px;
        }

        .image-filename {
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .image-actions {
            display: flex;
            gap: 0;
        }

        .image-actions a {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: black;
            color: white;
            text-decoration: none;
            font-size: 12px;
            border-right: 2px solid white;
        }

        .image-actions a:last-child {
            border-right: none;
        }

        .image-actions a:hover {
            background: white;
            color: black;
            outline: 2px solid black;
            outline-offset: -2px;
        }

        .stats {
            border: 2px solid black;
            padding: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 12px;
        }

        .stats.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>arXiv Image Extractor</h1>
            <div class="input-group">
                <input
                    type="text"
                    id="arxivUrl"
                    placeholder="Paste arXiv HTML URL here (e.g., https://arxiv.org/html/2510.21986v1)"
                    value="https://arxiv.org/html/2510.21986v1"
                >
                <button id="extractBtn" onclick="extractImages()">Extract Images</button>
            </div>
            <div class="info">
                Enter the URL of an arXiv HTML page to extract and display all images in a grid.
            </div>
        </div>

        <div id="status" class="status"></div>
        <div id="stats" class="stats"></div>
        <div id="imageGrid" class="image-grid"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const statsEl = document.getElementById('stats');
        const imageGridEl = document.getElementById('imageGrid');
        const extractBtn = document.getElementById('extractBtn');
        const urlInput = document.getElementById('arxivUrl');

        function showStatus(message) {
            statusEl.textContent = message;
            statusEl.className = 'status show';
        }

        function hideStatus() {
            statusEl.className = 'status';
        }

        function showStats(count) {
            statsEl.innerHTML = `Found <strong>${count}</strong> image${count !== 1 ? 's' : ''}`;
            statsEl.className = 'stats show';
        }

        function hideStats() {
            statsEl.className = 'stats';
        }

        async function extractImages() {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Please enter a URL');
                setTimeout(hideStatus, 3000);
                return;
            }

            if (!url.includes('arxiv.org/html/')) {
                showStatus('Please enter a valid arXiv HTML URL');
                setTimeout(hideStatus, 3000);
                return;
            }

            extractBtn.disabled = true;
            extractBtn.textContent = 'Extracting...';
            imageGridEl.innerHTML = '';
            hideStats();
            showStatus('Fetching arXiv page...');

            try {
                // Try multiple CORS proxies with fallback
                const proxies = [
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                    `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
                ];

                let html = null;
                let lastError = null;

                for (let i = 0; i < proxies.length; i++) {
                    try {
                        showStatus(`Fetching arXiv page... (proxy ${i + 1}/${proxies.length})`);
                        const response = await fetch(proxies[i], {
                            signal: AbortSignal.timeout(10000)
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        html = await response.text();
                        break; // Success!
                    } catch (err) {
                        lastError = err;
                        console.warn(`Proxy ${i + 1} failed:`, err.message);
                        // Try next proxy
                    }
                }

                if (!html) {
                    throw new Error(`All proxies failed. Last error: ${lastError.message}`);
                }

                showStatus('Parsing images...');

                // Parse HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Extract all images
                const images = doc.querySelectorAll('img');
                const imageData = [];

                // Get base URL for relative paths
                const baseUrl = new URL(url);
                const baseOrigin = baseUrl.origin;
                const basePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/'));

                images.forEach((img, index) => {
                    let src = img.src || img.getAttribute('src');
                    if (!src) return;

                    // Convert relative URLs to absolute
                    if (src.startsWith('/')) {
                        src = baseOrigin + src;
                    } else if (!src.startsWith('http')) {
                        src = baseOrigin + basePath + '/' + src;
                    }

                    // Skip tiny images (likely icons)
                    const width = img.width || img.naturalWidth || 0;
                    const height = img.height || img.naturalHeight || 0;
                    if (width < 50 && height < 50 && (width > 0 || height > 0)) {
                        return;
                    }

                    const alt = img.alt || `Image ${index + 1}`;
                    const filename = src.split('/').pop().split('?')[0] || `image-${index + 1}`;

                    imageData.push({ src, alt, filename });
                });

                if (imageData.length === 0) {
                    showStatus('No images found on this page');
                    extractBtn.disabled = false;
                    extractBtn.textContent = 'Extract Images';
                    return;
                }

                // Display images
                imageData.forEach((img, index) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';

                    card.innerHTML = `
                        <div class="image-wrapper">
                            <img src="${img.src}" alt="${img.alt}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'padding: 20px; text-align: center;\\'>Failed to load</div>'">
                        </div>
                        <div class="image-info">
                            <div class="image-filename">${img.filename}</div>
                            <div class="image-actions">
                                <a href="${img.src}" target="_blank">Open</a>
                                <a href="${img.src}" download="${img.filename}">Download</a>
                            </div>
                        </div>
                    `;

                    imageGridEl.appendChild(card);
                });

                showStatus('Images extracted successfully!');
                showStats(imageData.length);
                setTimeout(hideStatus, 3000);

            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}`);
            } finally {
                extractBtn.disabled = false;
                extractBtn.textContent = 'Extract Images';
            }
        }

        // Allow Enter key to trigger extraction
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                extractImages();
            }
        });
    </script>
</body>
</html>
