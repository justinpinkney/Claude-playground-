<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Image Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info {
            color: #666;
            font-size: 14px;
        }

        .info a {
            color: #667eea;
            text-decoration: none;
        }

        .info a:hover {
            text-decoration: underline;
        }

        .status {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .image-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-info {
            padding: 15px;
            background: white;
        }

        .image-filename {
            font-size: 14px;
            color: #666;
            word-break: break-all;
            margin-bottom: 8px;
        }

        .image-actions {
            display: flex;
            gap: 8px;
        }

        .image-actions a {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .image-actions a:hover {
            background: #5568d3;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
            font-size: 14px;
            color: #666;
        }

        .stats.show {
            display: block;
        }

        .stats strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>arXiv Image Extractor</h1>
            <div class="input-group">
                <input
                    type="text"
                    id="arxivUrl"
                    placeholder="Paste arXiv HTML URL here (e.g., https://arxiv.org/html/2510.21986v1)"
                    value="https://arxiv.org/html/2510.21986v1"
                >
                <button id="extractBtn" onclick="extractImages()">Extract Images</button>
            </div>
            <div class="info">
                Enter the URL of an arXiv HTML page to extract and display all images in a grid.
            </div>
        </div>

        <div id="status" class="status"></div>
        <div id="stats" class="stats"></div>
        <div id="imageGrid" class="image-grid"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const statsEl = document.getElementById('stats');
        const imageGridEl = document.getElementById('imageGrid');
        const extractBtn = document.getElementById('extractBtn');
        const urlInput = document.getElementById('arxivUrl');

        function showStatus(message, type = 'loading') {
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;
        }

        function hideStatus() {
            statusEl.className = 'status';
        }

        function showStats(count) {
            statsEl.innerHTML = `Found <strong>${count}</strong> image${count !== 1 ? 's' : ''}`;
            statsEl.className = 'stats show';
        }

        function hideStats() {
            statsEl.className = 'stats';
        }

        async function extractImages() {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Please enter a URL', 'error');
                setTimeout(hideStatus, 3000);
                return;
            }

            if (!url.includes('arxiv.org/html/')) {
                showStatus('Please enter a valid arXiv HTML URL', 'error');
                setTimeout(hideStatus, 3000);
                return;
            }

            extractBtn.disabled = true;
            extractBtn.innerHTML = '<span class="spinner"></span>Extracting...';
            imageGridEl.innerHTML = '';
            hideStats();
            showStatus('Fetching arXiv page...', 'loading');

            try {
                // Use allOrigins CORS proxy to fetch the page
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);

                if (!response.ok) {
                    throw new Error(`Failed to fetch page: ${response.status}`);
                }

                const html = await response.text();
                showStatus('Parsing images...', 'loading');

                // Parse HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Extract all images
                const images = doc.querySelectorAll('img');
                const imageData = [];

                // Get base URL for relative paths
                const baseUrl = new URL(url);
                const baseOrigin = baseUrl.origin;
                const basePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/'));

                images.forEach((img, index) => {
                    let src = img.src || img.getAttribute('src');
                    if (!src) return;

                    // Convert relative URLs to absolute
                    if (src.startsWith('/')) {
                        src = baseOrigin + src;
                    } else if (!src.startsWith('http')) {
                        src = baseOrigin + basePath + '/' + src;
                    }

                    // Skip tiny images (likely icons)
                    const width = img.width || img.naturalWidth || 0;
                    const height = img.height || img.naturalHeight || 0;
                    if (width < 50 && height < 50 && (width > 0 || height > 0)) {
                        return;
                    }

                    const alt = img.alt || `Image ${index + 1}`;
                    const filename = src.split('/').pop().split('?')[0] || `image-${index + 1}`;

                    imageData.push({ src, alt, filename });
                });

                if (imageData.length === 0) {
                    showStatus('No images found on this page', 'error');
                    extractBtn.disabled = false;
                    extractBtn.innerHTML = 'Extract Images';
                    return;
                }

                // Display images
                imageData.forEach((img, index) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';

                    card.innerHTML = `
                        <div class="image-wrapper">
                            <img src="${img.src}" alt="${img.alt}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'color: #999; padding: 20px; text-align: center;\\'>Failed to load</div>'">
                        </div>
                        <div class="image-info">
                            <div class="image-filename">${img.filename}</div>
                            <div class="image-actions">
                                <a href="${img.src}" target="_blank">Open</a>
                                <a href="${img.src}" download="${img.filename}">Download</a>
                            </div>
                        </div>
                    `;

                    imageGridEl.appendChild(card);
                });

                showStatus('Images extracted successfully!', 'success');
                showStats(imageData.length);
                setTimeout(hideStatus, 3000);

            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                extractBtn.disabled = false;
                extractBtn.innerHTML = 'Extract Images';
            }
        }

        // Allow Enter key to trigger extraction
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                extractImages();
            }
        });
    </script>
</body>
</html>
